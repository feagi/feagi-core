# ============================================================================
#              Combo Library Crate and Workspace Cargo File
# ============================================================================

# NOTE: We make use of cfg compile flags to targets specific systems.
# See https://doc.rust-lang.org/reference/conditional-compilation.html#r-cfg.conditional
# TODO While embedded is under cfg target_os "none", but we need features to differentiate between embedded hardwares



# ============================================================================
#                          LIBRARY CONFIGURATION
# ============================================================================

[package]
name = "feagi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lints]
workspace = true

[features]

default = [
    "std",
    "runtime_feagi_design_server"
]

std = [
    "alloc",
    "thiserror/std", "serde/std", "serde_json/std",
    "feagi-basis/std", "feagi-basis/rayon", "feagi-interop/std", "feagi-genome/std",
    "feagi-migrator/std", "feagi-pns-structures/std", "feagi-pns-processing/std"
]

alloc = [
    "serde_json",
    "serde/alloc", "serde/derive", "serde_json/alloc",
    "feagi-basis/alloc", "feagi-interop/alloc",
    "feagi-genome/alloc", "feagi-migrator/alloc", "feagi-pns-structures/alloc", "feagi-pns-processing/alloc"
]

### Runtimes are default implementations ###

runtime_feagi_design_server = [
    "rest_swagger_ui", "zenoh_ws"
]

### Extensions of functionality ###

rest_server = [
    "feagi-interop/transport_rest"
]

rest_open_api = [
    "rest_server",
    "feagi-interop/open_api_endpoint"
]

rest_swagger_ui = [
    "rest_open_api",
    "feagi-interop/swagger_web_ui"
]

zenoh_ws = [
    "feagi-interop/transport_ws"
]

# TODO


[dependencies]
# FEAGI (Always)
feagi-basis = {path = "crates/feagi-basis", default-features = false}
feagi-interop = {path = "crates/feagi-interop"}

# Feagi (Sometimes)
feagi-genome = {path = "crates/feagi-genome"}
feagi-migrator = {path = "crates/feagi-migrator"}
feagi-pns-structures = {path = "crates/feagi-pns-structures"}
feagi-pns-processing = {path = "crates/feagi-pns-processing"}

# External (always)
thiserror = {workspace = true}
serde = {workspace = true, default-features = false}

# External (sometimes)
serde_json = {workspace = true, optional = true, default-features = false}

[dev-dependencies]

[[example]]
name = "designer_brain_server"
required-features = ["runtime_feagi_design_server"]


# ============================================================================
#                             WORKSPACE CONFIGURATION
# ============================================================================

[workspace]
resolver = "2"
members = [
    "crates/feagi-macro-components",

    "crates/feagi-basis",
    "crates/feagi-basis/feagi-basis-proc-common",

    "crates/feagi-connectome",
    "crates/feagi-connectome/feagi-connectome-proc",
    "crates/feagi-connectome/feagi-connectome-neural",
    "crates/feagi-connectome/feagi-connectome-neural/neural-basis",
    "crates/feagi-connectome/feagi-connectome-neural/neural-burst-cpu",
    "crates/feagi-connectome/feagi-connectome-neural/neural-burst-esp32",

    "crates/feagi-genome",

    "crates/feagi-interop",

    "crates/feagi-migrator",
    "crates/feagi-migrator/migrator-legacy-v5",

    "crates/feagi-pns-structures",
    "crates/feagi-pns-processing",

]


[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.98"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
repository = "https://github.com/feagi/feagi-core"
homepage = "https://feagi.org"
documentation = "https://docs.rs/feagi"


[workspace.dependencies] # Contains dependencies that several crates use
# Macro Stuff
paste = { version =  "1.0.15"}
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
proc-macro2 = "1.0.107"
heck = "0.5.0"
indexmap = "2.14.2"

# TODO a lot of these need default features stripped

# Always needed (nearly)
thiserror = {version = "2.0.21", default-features = false}
serde_arrays = {version = "0.2.0", default-features = false}
serde = { version = "1.0.229", default-features = false}
rand = {version = "0.10.3", default-features = false}
heapless = {version = "0.9.3"}
futures = {version = "0.3.34"}
half = {version = "2.7.1", default-features = false}
thingbuf = {version = "0.1.6", default-features = false}
ahash = { version = "0.8.12", default-features = false, features = ["compile-time-rng"] } # std is enabled per crate through their std features. NOTE: ahash "serde" forces serde/std on, avoid it
postcard = {version = "1.1.3", default-features = false} # TODO remove features
zenoh = {version = "1.10.1", default-features = false}
delegate = {version = "0.13.5"}

# Optional Feature Gated Crates
tracing = "0.1"  # Structured logging and diagnostics
log = {version = "0.4.34"}
defmt = {version = "1.1.1"}
serde_json = { version = "1.0.151", default-features = false}
rayon = {version = "1.12.0", default-features = false}
uuid = { version = "1.26.1", default-features = false }
flume = {version = "0.12.0"}
ndarray = { version = "0.17.2", default-features = false}
image = { version = "0.25.10", default-features = false }
base64 = {version = "0.23.1", default-features = false}
ohkami = {version = "0.24.9"}
smol = {version = "2.0.2"}
byteorder = {version = "1.5.0"}
picoserve = { version = "0.20.1", default-features = false, features = ["json"] } # TODO review features
serde-json-core = { version = "0.6.0", default-features = false }



[workspace.lints.rust]
unused_variables = "warn"

[profile.release]
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization, slower compile
opt-level = 3        # Maximum optimization
panic = "abort"      # Smaller binary, no unwinding

[profile.dev]
opt-level = 1        # Some optimization in dev for reasonable performance

[profile.benchmark]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[profile.test]
opt-level = 0
debug = true

# ============================================================================
# BINARY TOOLS
# ============================================================================

