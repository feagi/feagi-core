# ============================================================================
#              Combo Library Crate and Workspace Cargo File
# ============================================================================

# NOTE: We make use of cfg compile flags to targets specific systems.
# See https://doc.rust-lang.org/reference/conditional-compilation.html#r-cfg.conditional
# TODO While embedded is under cfg target_os "none", but we need features to differentiate between embedded hardwares



# ============================================================================
#                          LIBRARY CONFIGURATION
# ============================================================================

[package]
name = "feagi"
version = "0.1.1"
edition = "2021"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
description = "Framework for Evolutionary Artificial General Intelligence - Bio-Inspired Neural Computation"
repository = "https://github.com/feagi/feagi-core"
readme = "README.md"
keywords = ["neuroscience", "ai", "neural-network", "brain", "agi"]
categories = ["science", "simulation"]

[lints]
workspace = true

[features]
default = ["default-config-feagi-server"]
legacy-tools = []

# ========================= Common Configuration Sets ========================= #
# Common classes of FEAGI Applications using the crates of this library

# Default features for compiling the FEAGI Server
default-config-feagi-server = [
    "agent-transport-zmq",
    "agent-transport-websocket-std",
    "agent-transport-shm",
    "agent-transport-bluetooth",
    "agent-server",
    "use-rayon",
    "std",
]

# Default features for a FEAGI Agent (an embodiement, like a robot or game avatar) with std support (AKA not embedded).
# Note the transport protocol method will need to be specified!
default-config-feagi-agent-std = [
    #"agent-transport-zmq",
    #"agent-transport-websocket-std",
    #"agent-transport-shm",
    #"agent-transport-bluetooth",
    #"agent-client-asynchelper-tokio"
    "agent-client",
    "use-rayon",
    "std",
]

# Default features for a FEAGI Agent (an embodiement, like a robot or game avatar) without std.
# Note the transport protocol method will need to be specified!
default-config-feagi-agent-embedded = [
    #"agent-client",
    #"agent-transport-zmq",
    #"agent-transport-websocket-std",
    #"agent-transport-shm",
    #"agent-transport-bluetooth",
    #"agent-client-asynchelper-tokio"
]

# Default features for a FEAGI Genome Editor (mainly Brain Visualizer)
default-config-feagi-editor = [
    #"agent-client",
    "agent-transport-websocket-std",
    "use-rayon",
    "std",
]

# Compiles all feagi crates, mainly for creating wrappers in other languages. Does not include optional features!
default-config-feagi-language-lib = [
    # TODO
]

# ========================= Toggleable Features ========================= #
# Features that add certain libraries/crates that extend the functionality
# and performance of the FEAGI application
# In order of other features here, feagi crate features


# TODO These features should activate subcrate features

# Allows use of mutlithreading to accomplish large parallel tasks faster. Requires std.
use-rayon = [
    "std",
]

# Allows conversion of some FEAGI structs to / from NDArrays.
use-ndarray = [

]

use-image = []



# Specifies this is a client of a FEAGI server
agent-client = []

# Specifies this is a server running FEAGI
agent-server = []

# Transport types that can be used by the compiled program.
agent-transport-zmq = [
    #"feagi-agent/agent-client"
]
agent-transport-websocket-std = [
    "std",
    #"feagi-agent/agent-transport-websocket-std"
]
agent-transport-shm = [
    #"feagi-agent/agent-transport-shm"
]
agent-transport-bluetooth = [
    #"feagi-agent/agent-transport-bluetooth"
]

# Use the Rust Standard Library. Needs to be disabled by some compile targets. Enables alloc.
std = [
    "alloc",
]

# Allow the use of allocation (such as with vectors, hashmaps). Needs to be disabled by some compile targets.
alloc = [

]

# TODO WASM specific flags
# TODO Embedded specific flags (different features for things like embedded)


[dependencies]
# FEAGI



[dev-dependencies]



# ============================================================================
#                             WORKSPACE CONFIGURATION
# ============================================================================

[workspace]
resolver = "2"
members = [
    "crates/feagi-agent",
    "crates/feagi-api",
    "crates/feagi-brain-development",
    "crates/feagi-config",
    "crates/feagi-basis",
    "crates/feagi-basis/feagi-basis-quantization",
    "crates/feagi-basis/feagi-basis-neuron",
    "crates/feagi-basis/feagi-basis-genome",
    "crates/feagi-basis/feagi-basis-genome/feagi-basis-genome-proc",
    "crates/feagi-basis/feagi-basis-error-logging",
    "crates/feagi-basis/feagi-basis-error-logging/feagi-basis-error-logging-proc",
    "crates/feagi-evolutionary",
    "crates/feagi-genomic-context",
    "crates/feagi-genomic-data",
    "crates/feagi-io",
    "crates/feagi-models",
    "crates/feagi-observability",
    "crates/feagi-sensorimotor",
    "crates/feagi-serialization",
    "crates/feagi-services",
    "crates/feagi-state-manager",
    "crates/test-loop",
    "crates/feagi-brain",
    "crates/feagi-brain/feagi-brain-npu",
    "crates/feagi-brain/feagi-brain-npu/feagi-npu-burst-engines",
    "crates/feagi-brain/feagi-brain-npu/feagi-npu-burst-engines/feagi-npu-burst-core",
    "crates/feagi-brain/feagi-brain-npu/feagi-npu-burst-engines/feagi-npu-burst-rayon",
    "crates/feagi-brain/feagi-brain-npu/feagi-npu-burst-engines/feagi-npu-burst-esp32",
]


[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
repository = "https://github.com/feagi/feagi-core"
homepage = "https://feagi.org"
documentation = "https://docs.rs/feagi"


[workspace.dependencies] # Contains dependencies that several crates use
# Macro Stuff
paste = { version =  "1.0.15"}
quote = "1.0.47"
syn = { version = "3.0.5", features = ["full"] }
proc-macro2 = "1.0.107"
heck = "0.5.0"

# Always needed (nearly)
serde = { version = "1.0.229", default-features = false}
heapless = {version = "0.9.3"}
futures = {version = "0.3.34"}
half = {version = "2.7.1", default-features = false}
ahash = { version = "0.8.12", default-features = false, features = ["std", "serde", "compile-time-rng"] } # TODO remove features

# Optional Feature Gated Crates
thiserror = "1.0.50" # TODO migrate away from this
tracing = "0.1"  # Structured logging and diagnostics # TODO migrate away from this
log = {version = "0.4.34"}
defmt = {version = "1.1.1"}
serde_json = { version = "1.0.151", default-features = false}
rayon = {version = "1.12.0", default-features = false}
uuid = { version = "1.26.1", features = ["v7", "serde", "js"] }  # js feature for WASM supporto
flume = {version = "0.12.0"}
ndarray = { version = "0.17.2", default-features = false}
image = { version = "0.25.10", default-features = false }
base64 = {version = "0.23.1", default-features = false}







[workspace.lints.rust]
unused_variables = "warn"

[profile.release]
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization, slower compile
opt-level = 3        # Maximum optimization
panic = "abort"      # Smaller binary, no unwinding

[profile.dev]
opt-level = 1        # Some optimization in dev for reasonable performance

[profile.benchmark]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[profile.test]
opt-level = 0
debug = true

