# ============================================================================
#              Combo Library Crate and Workspace Cargo File
# ============================================================================

# NOTE: We make use of cfg compile flags to targets specific systems.
# See https://doc.rust-lang.org/reference/conditional-compilation.html#r-cfg.conditional
# TODO While embedded is under cfg target_os "none", but we need features to differentiate between embedded hardwares



# ============================================================================
#                          LIBRARY CONFIGURATION
# ============================================================================

[package]
name = "feagi-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[lints]
workspace = true

[features]

default = [
    "std",
]

# Default setup for a computer running a Feagi Brain Server
default_usecase_server_std = [
    "std",
    "feagi-brain-server",
    "feagi-server-requests-rest"
]



std = [
    "alloc",
    "serde/std", "serde_json/std",
]

alloc = [
    "serde_json",
    "serde/alloc", "serde/derive", "serde_json/alloc",
]

# Functionality for FEAGI to run as a brain server
feagi-brain-server = [

]


feagi-server-requests-rest = [
    "feagi-brain-server",

]

# TODO


[dependencies]
# FEAGI
feagi-basis = {path = "crates/feagi-basis"}
feagi-brain = {path = "crates/feagi-brain"}

# External (always)
serde = {workspace = true, default-features = false}

# External (sometimes)
serde_json = {workspace = true, optional = true, default-features = false}

[dev-dependencies]






# ============================================================================
#                             WORKSPACE CONFIGURATION
# ============================================================================

[workspace]
resolver = "2"
members = [
    "crates/feagi-macro-components",
    "crates/feagi-basis",

    "crates/feagi-data",
    "crates/feagi-data/feagi-data-basis",
    "crates/feagi-data/feagi-data-neuron",
    "crates/feagi-data/feagi-data-genome",
    "crates/feagi-data/feagi-data-genome/feagi-basis-genome-proc",

    "crates/feagi-brain",
    "crates/feagi-brain/feagi-brain-models",
    "crates/feagi-brain/feagi-brain-npu",
    "crates/feagi-brain/feagi-brain-npu/feagi-npu-burst-engines",
    "crates/feagi-brain/feagi-brain-npu/feagi-npu-burst-engines/feagi-npu-burst-basis",
    "crates/feagi-brain/feagi-brain-npu/feagi-npu-burst-engines/feagi-npu-burst-rayon",
    "crates/feagi-brain/feagi-brain-npu/feagi-npu-burst-engines/feagi-npu-burst-esp32",

    "crates/feagi-transports",

    "crates/feagi-runtimes"
]


[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["Neuraville Inc. <feagi@neuraville.com>"]
license = "Apache-2.0"
repository = "https://github.com/feagi/feagi-core"
homepage = "https://feagi.org"
documentation = "https://docs.rs/feagi"


[workspace.dependencies] # Contains dependencies that several crates use
# Macro Stuff
paste = { version =  "1.0.15"}
quote = "1.0.47"
syn = { version = "3.0.6", features = ["full"] }
proc-macro2 = "1.0.107"
heck = "0.5.0"


# Always needed (nearly)
thiserror = {version = "2.0.21", default-features = false}
serde_arrays = {version = "0.2.0", default-features = false}
serde = { version = "1.0.229", default-features = false}
heapless = {version = "0.9.3"}
futures = {version = "0.3.34"}
half = {version = "2.7.1", default-features = false}
thingbuf = {version = "0.1.6", default-features = false}
ahash = { version = "0.8.12", default-features = false, features = ["std", "serde", "compile-time-rng"] } # TODO remove features
postcard = {version = "1.1.3", default-features = false} # TODO remove features
zenoh = {version = "1.10.1", default-features = false}

# Optional Feature Gated Crates
tracing = "0.1"  # Structured logging and diagnostics # TODO migrate away from this
log = {version = "0.4.34"}
defmt = {version = "1.1.1"}
serde_json = { version = "1.0.151", default-features = false}
rayon = {version = "1.12.0", default-features = false}
uuid = { version = "1.26.1", features = ["v7", "serde", "js"] }  # js feature for WASM supporto
flume = {version = "0.12.0"}
ndarray = { version = "0.17.2", default-features = false}
image = { version = "0.25.10", default-features = false }
base64 = {version = "0.23.1", default-features = false}
ohkami = {version = "0.24.9"}
smol = {version = "2.0.2"}
byteorder = {version = "1.5.0"}



[workspace.lints.rust]
unused_variables = "warn"

[profile.release]
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization, slower compile
opt-level = 3        # Maximum optimization
panic = "abort"      # Smaller binary, no unwinding

[profile.dev]
opt-level = 1        # Some optimization in dev for reasonable performance

[profile.benchmark]
inherits = "release"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[profile.test]
opt-level = 0
debug = true

# ============================================================================
# BINARY TOOLS
# ============================================================================

# TODO review these

[[bin]]
name = "migrate_genome"
path = "tools/migrate_genome.rs"
required-features = ["legacy-tools"]

[[bin]]
name = "perf_compare"
path = "tools/perf_compare.rs"
required-features = ["legacy-tools"]
