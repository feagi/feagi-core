# License policy for every crate linked into FEAGI. Run: cargo deny check licenses
#
# Only permissive licenses are allowed. Where a crate offers a choice and
# Apache-2.0 is one of the options, FEAGI elects Apache-2.0. That includes
# "MIT OR Apache-2.0 OR LGPL-2.1-or-later" (r-efi): the LGPL option is declined.
# A crate that does not offer Apache-2.0 is taken under the permissive option
# it does offer (MIT, for "MIT OR GPL-3.0-only"). Copyleft licenses (GPL, LGPL,
# AGPL) must never be the only option: Rust links statically, so any LGPL-only
# or GPL-only crate would bind the FEAGI binary. The elected license for every
# crate is recorded in THIRD_PARTY_NOTICES.txt.
# MPL-2.0 is file-level copyleft: allowed unmodified, never patched in-tree.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
