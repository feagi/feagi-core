[package]
name = "feagi-basis-collections"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Used to hold various collections of various data types for FEAGI"


[features]

# subcrates should not have default in order to avoid confusion

std = [
    "alloc",
    "thiserror/std", "half/std", "serde/std", "serde_json/std",
]

alloc = [
    "half/alloc", "serde/alloc", "serde_json/alloc", "heapless/alloc"
]


expose_rayon = [
    "std",
    "rayon",
]

[dependencies]
# Sub Crates

# Sibling Crates
feagi-basis-quantization = {path = "../feagi-basis-quantization"}

# Root Crates
# NONE! NOTHING WITHIN BASIS CAN USE OTHER ROOT CRATES!

# External Crates
thiserror = {workspace = true}
paste = { workspace = true }
half = {workspace = true, default-features = false, features = ["serde"]}
serde = { workspace = true, default-features = false, features = ["derive"]}
heapless = {workspace = true, default-features = false, features = ["serde"]}
serde_arrays ={workspace = true}
serde_json = { workspace = true, optional = true, default-features = false}

rayon = {workspace = true, optional = true, default-features = false}

[dev-dependencies]
feagi-basis-quantization = { path = "../feagi-basis-quantization" }