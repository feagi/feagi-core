[package]
name = "feagi-basis-genome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Structures for Genome Structure Identification and optionally their metadata properties"

[features]

# subcrates should not have default in order to avoid confusion

std = [
    "alloc",
    "serde/std", "serde_json/std", "base64/std"
]

alloc = [
    "serde/alloc", "serde_json/alloc", "base64/alloc"
]

# Allow JSON serialization / deserialization of structures
serialization_support_json = [
    "serde_json"
]

support_base64 = [
    "base64"
]


[dependencies]

# Sub Crates

# Sibling Crates
feagi-basis-error-logging = {path = "../feagi-basis-error-logging"}
feagi-basis-quantization = {path = "../feagi-basis-quantization" }

# Root Crates
# NONE! NOTHING WITHIN BASIS CAN USE OTHER ROOT CRATES!

# External Crates
paste = { workspace = true }
ahash = { workspace = true}
serde = { workspace = true}
uuid = {workspace = true}
serde_json = { workspace = true, optional = true}
base64 = {workspace = true, optional = true}

[lints]
workspace = true