[package]
name = "feagi-npu-burst-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Shared logic / traits for burst engines"

[features]

# Note: nested sub crates should not have default features in order to prevent confusion upstream

# ========================= Standard Toggleable Features ========================= #

std = [
    "alloc",
]

alloc = [
    "serde/alloc",
    "heapless/alloc"
]

[dependencies]
feagi-data = {path = "../../../feagi-data" }
feagi-models = {path = "../../../feagi-models" }
feagi-logging-and-errors = {path = "../../../feagi-logging-and-errors" }

paste = { workspace = true}
serde = {workspace = true} # Required by FeagiError
heapless = {workspace = true, default-features = false}