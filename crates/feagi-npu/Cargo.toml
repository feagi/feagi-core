[package]
name = "feagi-npu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Contains the logic for the neural processing unit and their interfacing"


[features]

default = [
    "std",
    "use-rayon",
    "editable"
]

# ========================= Toggleable Features ========================= #
# Features that add certain libraries/crates that extend the functionality
# and performance of the FEAGI application
# In order of Directly activated crates, other features here, external crate features, feagi crate features

# Allows use of mutlithreading to accomplish large parallel tasks faster. Requires std.
use-rayon = [
    "rayon",
    "std",
]

# Enables interfaces for editing connectomes, such as adding / removing cortical areas and mappings
editable = [
    "std"
]


std = [
    "alloc",
    "parking_lot",
    "serde/std", "serde_json/std", "ahash/std"
]

alloc = [
    "serde", "serde_json",
    "serde/alloc", "serde/derive", "serde_json/alloc", "ahash/serde",
]



[dependencies]
feagi-data = {path = "../feagi-data"}
feagi-models = {path = "../feagi-models" }
feagi-logging-and-errors = {path = "../feagi-logging-and-errors"}
feagi-genomic-context = {path = "../feagi-genomic-context"}
feagi-npu-burst-core = {path = "feagi-npu-burst-core"}
feagi-npu-burst-rayon = {path = "feagi-npu-burst-rayon"}


# External crates
paste = { workspace = true}
half = {workspace = true}
ahash = { workspace = true}
# Runtime taps only; std-gated along with the `runtime_taps` module.
serde = { workspace = true, optional = true}
serde_json = { workspace = true, optional = true}
rayon = { workspace = true, optional = true}

# TODO we should tie these to workspace
parking_lot = { version = "0.12", optional = true }
tokio = {version = "1.53.1", features = ["rt", "macros", "time"]} # TODO Optional
tokio-util = { version = "0.7.19", features = ["full"] }
futures = {version =  "0.3.34" }
flume = { version = "0.11", default-features = false, features = ["async"] } # TODO tie to workspace

[lints]
workspace = true
