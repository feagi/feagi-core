[package]
name = "feagi-interop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Root library extending Zenoh for use in FEAGI as a transport medium"

[lib]

[features]

std = [
    "alloc",
    "serde/std", "serde_json/std"
]

alloc = [
    "serde/alloc", "serde_json/alloc"
]

transport_rest = [
    "picoserve"
]

transport_ws = []

transport_quic = []

swagger_web_ui = [
    "transport_rest"
]

# TODO other transports, compression, auth?

[dependencies]
# Internal Crates
feagi-basis = {path = "../feagi-basis"}

# External Crates
thiserror = {workspace = true}
paste = {workspace = true}
serde = { workspace = true, features = ["derive"] }
serde_json = {workspace = true, features = []}
zenoh = {workspace = true, features = ["default", "unstable", "internal"]}
picoserve = {workspace = true, optional = true}



[lints]
workspace = true
