[package]
name = "feagi-interop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Root library extending Zenoh for use in FEAGI as a transport medium"

[lib]

[features]

std = [
    "alloc",
    "zenoh",
    "thiserror/std", "thingbuf/std", "base64/std", "serde/std",
    "serde_json/std", "picoserve/std"
]

alloc = [
    "thingbuf/alloc", "base64/alloc", "serde/alloc",
    "serde_json/alloc", "picoserve/alloc"
]

transport_rest = [
    "picoserve", "serde-json-core"
]

transport_ws = [
    "zenoh?/transport_ws"
]

transport_quic = []

open_api_endpoint = [
    "transport_rest"
]

swagger_web_ui = [
    "open_api_endpoint"
]

# TODO other transports, compression, auth?

[dependencies]
# Root Crates
feagi-basis = { path = "../feagi-basis" }

# External Crates
# Always used
thiserror = { workspace = true }
thingbuf = { workspace = true }
base64 = { workspace = true }
paste = { workspace = true }
serde = { workspace = true, features = ["derive"] }
heapless = { workspace = true }
rand = {workspace = true}

# STD toggled
zenoh = { workspace = true, optional = true, features = ["default", "unstable", "internal"] } # TODO swap this with zenoh-no-std in no std env

# Optionally Used
serde_json = { workspace = true, optional = true }
picoserve = { workspace = true, optional = true }
serde-json-core = { workspace = true, optional = true }



[lints]
workspace = true
