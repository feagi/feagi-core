[package]
name = "neural-burst-esp32"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "A burst engine for running on the ESP32 family of SOCs"

[features]

# Note: nested sub crates should not have default features in order to prevent confusion upstream

# ========================= Standard Toggleable Features ========================= #

alloc = [
    "serde/alloc", "heapless/alloc",
    "feagi-basis/alloc", "neural-basis/alloc",
]

# ========================= Platform ========================= #

# TODO seperate features for PSRAM amount?


[dependencies]
# Sub Crates

# Sibling Crates
neural-basis = {path = "../neural-basis" }

# Root Crates
feagi-basis = {path = "../../../feagi-basis", default-features = false }


# External Crates
paste = { workspace = true}
serde = {workspace = true} # Required by FeagiError
heapless = {workspace = true, default-features = false}