[package]
name = "feagi-connectome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Neural connectome of FEAGI: shared basis, neuron models and burst engines"

[features]

std = [
    "alloc",
    "connectome-basis/std", "connectome-models/std", "connectome-burst/std",
]

alloc = [
    "connectome-basis/alloc", "connectome-models/alloc", "connectome-burst/alloc",
]

burst-cpu = [
    "std",
    "connectome-burst/burst-cpu",
]

burst-esp32 = [
    "connectome-burst/burst-esp32",
]


[dependencies]
# Child Crates
connectome-basis = { path = "connectome-basis", default-features = false }
connectome-models = { path = "connectome-models", default-features = false }
connectome-burst = { path = "connectome-burst", default-features = false }
connectome-proc = { path = "connectome-proc" }

[dev-dependencies]
feagi-basis = { path = "../feagi-basis", features = ["std"] }

[lints]
workspace = true
