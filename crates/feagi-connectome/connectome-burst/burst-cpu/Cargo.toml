[package]
name = "burst-cpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rayon burst engine logic for multithread / core CPU neuron processing"

[features]

# // TODO do we even need these features? Wouldnt std and alloc always be on here???

std = [
    "alloc",
    "serde/std", "half/std", "ahash/std",
    "feagi-basis/std", "connectome-basis/std", "connectome-models/std",
]

alloc = [
    
    "serde/alloc", "heapless/alloc", "half/alloc",
    "feagi-basis/alloc", "connectome-basis/alloc", "connectome-models/alloc",
]

rayon = [
    "std",
    "dep:rayon"
]

[dependencies]
# Connectome Crates
burst-basis = {path = "../burst-basis", default-features = false}
connectome-basis = {path = "../../connectome-basis", default-features = false }
connectome-models = {path = "../../connectome-models", default-features = false }


# Root Crates
feagi-basis = {path = "../../../feagi-basis", default-features = false }

# External Crates
paste = { workspace = true}
serde = {workspace = true} # Required by FeagiError
heapless = {workspace = true, default-features = false, features = ["serde"]}
half = {workspace = true, default-features = false, features = ["serde"]}
ahash = { workspace = true, default-features = false, features = ["serde"]}
thiserror = {workspace = true}
rayon = { workspace = true, default-features = false, optional = true}