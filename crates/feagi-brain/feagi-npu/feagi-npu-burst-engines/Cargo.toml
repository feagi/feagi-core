[package]
name = "feagi-npu-burst-engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Contains the Burst Engines for various hardwares, which handle the processing of the connectome"

# TODO features to control what burst engines are accessible

[features]

# Note: nested sub crates should not have default features in order to prevent confusion upstream

# ========================= Standard Toggleable Features ========================= #

std = [
    "alloc",
]

alloc = [
    "feagi-npu-burst-core/alloc",
    "feagi-npu-burst-esp32/alloc"
]

# ========================= Burst Engines to enable ========================= #

# CPU burst engine that uses multiple cpu threads to process neurons (includes variants that are optimized for different uses, cpus)
engines-rayon = [
    "std",
    "feagi-npu-burst-rayon"
]

# Family of engines for the ESP32 family of chips and boards
engines-esp32 = ["feagi-npu-burst-esp32"]

# ========================= Platform Specific Dependencies ========================= #

# NOTE: Right now none of these are being used, but that may change later

# For MicroSlop operating systems
#[target.'cfg(windows)'.dependencies]

# For Pingu and Tim Apple operating systems
#[target.'cfg(unix)'.dependencies]

# For Internet Explorer 6
#[target.'cfg(target_arch = "wasm32")'.dependencies]

# For ESP32 Xtensa boards (not all ESP32 devices are Xtensa! Some are Risc-V!)
#[target.'cfg(target_arch = "xtensa")'.dependencies]


[dependencies]
feagi-npu-burst-core = {path = "feagi-npu-burst-core"}
feagi-npu-burst-rayon = {path = "feagi-npu-burst-rayon", optional = true}
feagi-npu-burst-esp32 = {path = "feagi-npu-burst-esp32", optional = true}

feagi-data = {path = "../../feagi-data" }
feagi-models = {path = "../../feagi-models" }
feagi-logging-and-errors = {path = "../../feagi-logging-and-errors" }

paste = {workspace = true}
heapless = {workspace = true}