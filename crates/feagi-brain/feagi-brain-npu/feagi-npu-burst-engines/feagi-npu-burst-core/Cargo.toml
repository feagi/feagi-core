[package]
name = "feagi-npu-burst-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Shared logic / traits for burst engines"

[features]

# Note: nested sub crates should not have default features in order to prevent confusion upstream

# ========================= Standard Toggleable Features ========================= #

std = [
    "alloc",
]

alloc = [
    "serde/alloc",
    "heapless/alloc"
]

[dependencies]
# Sub Crates

# Sibling Crates


# Parent Crates
feagi-brain-models = {path = "../../../feagi-brain-models"}

# Root Crates
feagi-basis = {path = "../../../../feagi-basis" }

# External Crates
paste = { workspace = true}
serde = {workspace = true} # Required by FeagiError
heapless = {workspace = true, default-features = false}