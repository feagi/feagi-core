[package]
name = "feagi-trainer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FEAGI Trainer - open-source train/evaluate/benchmark engine for FEAGI spiking neural brains"

[lib]
name = "feagi_trainer"
path = "src/lib.rs"

[[bin]]
name = "feagi-trainer"
path = "src/main.rs"

[features]
# Concrete remote/ZMQ `FeagiRuntime` over the `feagi-agent` client path (Phase 1b). Off by
# default so the pure data-pipeline build stays lean and free of the native ZMQ dependency;
# enable it (and run the live-FEAGI integration test) only where a FEAGI endpoint exists.
remote-runtime = ["dep:feagi-agent", "dep:feagi-io", "dep:feagi-serialization"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Shared dataset/experience interchange primitives (extracted in Phase 1a so the capture
# side can reuse them without depending on this engine).
feagi-dataset-contracts = { workspace = true }

# FEAGI substrate: neuron-voxel data types and the coder/ConnectorCache layer.
# The encoder/decoder plugins are selectors over these (ADR-006, Appendix B.1).
feagi-structures = { version = "=0.0.12", path = "../feagi-structures" }
feagi-sensorimotor = { version = "=0.0.12", path = "../feagi-sensorimotor" }

# Remote/ZMQ runtime path (optional; behind `remote-runtime`). The open crate stays a pure
# ZMQ/`feagi-agent` client — no Composer/REST coupling (ADR-006).
feagi-agent = { version = "=0.0.12", path = "../feagi-agent", default-features = false, features = [
    "platform-std",
    "agent-client",
    "agent-transport-zmq",
], optional = true }
feagi-io = { version = "=0.0.12", path = "../feagi-io", optional = true }
feagi-serialization = { version = "=0.0.12", path = "../feagi-serialization", optional = true }
