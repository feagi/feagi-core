[package]
name = "feagi-brain-processing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true

[features]

std = [
    "alloc",
    "feagi-npu-burst-basis/std", "feagi-npu-burst-rayon?/std", "feagi-npu-burst-esp32?/std", "feagi-basis/std", "feagi-brain-basis/std"
]

alloc = [
    "feagi-npu-burst-basis/alloc", "feagi-npu-burst-rayon?/alloc", "feagi-npu-burst-esp32?/alloc", "feagi-basis/alloc", "feagi-brain-basis/alloc"
]

# ========================= Burst Engines to enable ========================= #

# CPU burst engine that uses multiple cpu threads to process neurons (includes variants that are optimized for different uses, cpus)
engines-rayon = ["feagi-npu-burst-rayon"]

# Family of engines for the ESP32 family of chips and boards
engines-esp32 = ["feagi-npu-burst-esp32"]

[dependencies]
# Sub Crates
feagi-npu-burst-basis = {path = "burst-engines/feagi-npu-burst-basis" }
feagi-npu-burst-rayon = {path = "burst-engines/feagi-npu-burst-rayon", optional = true }
feagi-npu-burst-esp32 = {path = "burst-engines/feagi-npu-burst-esp32", optional = true }

# Root Crates
feagi-basis = {path = "../feagi-basis", default-features = false }
feagi-brain-basis = {path = "../feagi-brain-basis" }

[lints]
workspace = true
