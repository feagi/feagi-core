[package]
name = "feagi-npu-burst-basis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Shared logic / traits for burst engines"

[features]

# Note: nested sub crates should not have default features in order to prevent confusion upstream

# ========================= Standard Toggleable Features ========================= #

std = [
    "alloc",
    "feagi-basis/std", "feagi-brain-basis/std"
]

alloc = [
    "serde/alloc",
    "heapless/alloc",
    "feagi-basis/alloc", "feagi-brain-basis/alloc"
]

[dependencies]
# Sub Crates

# Sibling Crates


# Root Crates
feagi-basis = {path = "../../../feagi-basis", default-features = false }
feagi-brain-basis = {path = "../../../feagi-brain-basis" }

# External Crates
paste = { workspace = true}
serde = {workspace = true} # Required by FeagiError
heapless = {workspace = true, default-features = false}