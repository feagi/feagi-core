[package]
name = "feagi-npu-burst-rayon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Rayon burst engine logic for multithread / core CPU neuron processing"

[features]

# Note: nested sub crates should not have default features in order to prevent confusion upstream

# ========================= Standard Toggleable Features ========================= #

std = [
    "alloc",
    "feagi-npu-burst-basis/std", "feagi-basis/std", "feagi-brain-basis/std"
]

alloc = [
    "feagi-npu-burst-basis/alloc", "feagi-basis/alloc", "feagi-brain-basis/alloc"
]

[dependencies]
# Sub Crates

# Sibling Crates
feagi-npu-burst-basis = {path = "../feagi-npu-burst-basis" }

# Root Crates
feagi-basis = {path = "../../../feagi-basis", default-features = false }
feagi-brain-basis = {path = "../../../feagi-brain-basis" }

# External Crates
paste = { workspace = true}
serde = {workspace = true} # Required by FeagiError
heapless = {workspace = true, default-features = false}
half = {workspace = true}
ahash = { workspace = true}
rayon = { workspace = true}