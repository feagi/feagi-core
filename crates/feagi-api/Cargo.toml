[package]
name = "feagi-api"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "FEAGI REST API layer with HTTP and ZMQ transport adapters"

[dependencies]
# Core FEAGI
# feagi-services is always needed (for trait definitions), but can work without tokio
feagi-services = {  path = "../feagi-services", default-features = false, features = ["wasm", "connectome-io"] }
feagi-evolutionary = {  path = "../feagi-evolutionary" } # For embedded default genomes
feagi-genomic-context = {  path = "../feagi-genomic-context" }
feagi-genomic-data = {  path = "../feagi-genomic-data" }
feagi-io = {  path = "../feagi-io", optional = true, features = ["zmq-transport", "websocket-transport-std"] } # For transport primitives and domain logic
feagi-brain-development = {  path = "../feagi-brain-development", optional = true } # For examples
feagi-state-manager = {  path = "../feagi-state-manager", default-features = false, optional = true }
feagi-serialization = {  path = "../feagi-serialization" }
feagi-agent = {  path = "../feagi-agent", optional = true, default-features = false, features = ["agent-client", "agent-client-asynchelper-tokio"] }
feagi-config = {  path = "../feagi-config" }
# Burst-loop introspection taps behind the input/output diagnostic endpoints.
feagi-npu = {  path = "../feagi-npu", optional = true }

# HTTP/REST (optional - not needed for WASM)
axum = { version = "0.7", optional = true, features = ["multipart"] }
tower = { version = "0.4", optional = true, features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"], optional = true }
hyper = { version = "1.0", optional = true }
http-body-util = { version = "0.1", optional = true }

# Note: ZMQ provided by feagi-io transport primitives

# Async runtime (optional - not needed for WASM)
tokio = { version = "1.0", features = ["full"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"

# Validation
validator = { version = "0.18", features = ["derive"] }

# OpenAPI (utoipa - compile-time, full OpenAPI 3.0 support)
# Available even without http feature (for endpoint documentation)
utoipa = { version = "4.0", features = ["axum_extras"], default-features = false }
utoipa-swagger-ui = { version = "6.0", features = ["axum"], optional = true }

# Observability
feagi-observability = { workspace = true }

# Logging (now via feagi-observability)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Security (stubs for now, all MIT/Apache-2.0 compatible)
chacha20poly1305 = { version = "0.10", optional = true }
x25519-dalek = { version = "2.0", optional = true }
jsonwebtoken = { version = "9.0", optional = true }
argon2 = { version = "0.5", optional = true }

# TLS
rustls = { version = "0.21", optional = true }
tokio-rustls = { version = "0.24", optional = true }

# Error handling
thiserror = "1.0"

# HTTP client (for testing against Python API)
reqwest = { version = "0.11", features = ["json"] }

# Concurrency
parking_lot = "0.12"

# Default data root (~/.feagi) when FEAGI_DATA_DIR / [system].data_dir is unset (matches feagi-python-sdk FeagiPaths)
dirs = "5.0"

# Async traits
async-trait = "0.1"

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# ZMQ (for transport primitives from feagi-io)
zeromq = { version = "0.4.1", optional = true }

[dev-dependencies]
# Contract testing
insta = "1.34"
wiremock = "0.6"
assert-json-diff = "2.0"
tokio-test = "0.4"

[features]
default = ["http", "services"]
http = ["axum", "tower", "tower-http", "hyper", "http-body-util", "tokio", "utoipa-swagger-ui", "services"]
services = ["feagi-services/std", "feagi-services/plasticity", "feagi-io", "feagi-brain-development", "feagi-state-manager/std", "feagi-agent", "feagi-npu"]
# The bundled feagi-services implementations, used by this crate's examples and contract tests.
# Not required by the library itself, which depends only on the service traits.
builtin-impls = ["services", "feagi-services/builtin-impls"]

# Response formatters for the neuron/synapse introspection endpoints, which still target the
# pre-refactor ConnectomeManager. Off by default; those endpoints report 501 until it is ported.
legacy-connectome = ["services", "feagi-brain-development/legacy-connectome"]
zmq = ["feagi-io", "dep:zeromq", "services"]  # feagi-io provides transport primitives
security = ["chacha20poly1305", "x25519-dalek", "jsonwebtoken", "argon2"]
tls = ["rustls", "tokio-rustls"]

