[package]
name = "feagi-logging-and-errors"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
std = ["alloc", "tracing"]
alloc = []
tracing = ["dep:tracing"]
defmt = ["dep:defmt"] # This should not be enabled with std

[dependencies]
tracing = {workspace = true, optional = true}
defmt = {workspace = true, optional = true}
feagi-logging-and-errors-derive = { path = "feagi-logging-and-errors-derive" }