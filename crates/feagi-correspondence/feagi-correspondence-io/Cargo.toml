[package]
name = "feagi-correspondence-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description = "Defines the interfaces to exchange data by FEAGI agents and servers"

[features]
# subcrates should not have default in order to avoid confusion

std = [
    "alloc",
    "serde/std", "serde_json/std",
]

alloc = [
    "serde_json",
    "serde/alloc", "serde/derive", "serde_json/alloc",
]

[dependencies]
# Sub Crates

# Sibling Crates

# Root Crates
feagi-basis = {path = "../../feagi-basis"}

# External crates
serde = { workspace = true }
serde_json = { workspace = true, optional = true }